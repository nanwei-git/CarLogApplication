openapi: 3.0.3
info:
  title: 鸿蒙智能座舱系统接口（依据《鸿蒙智能座舱系统接口文档V1.1》）
  version: 1.1
  description: |
    车主 APP（鸿蒙 ArkTS）直连的真后端接口契约，依据《鸿蒙智能座舱系统接口文档V1.1》整理，
    用于测试与校验。
    基础地址：http://121.36.14.143:10001
    约定：
    - 除登录/注册外，所有接口需在 Header 带 Authorization: Bearer <token>
    - 响应对信封不统一：
        · getInfo / logList 的字段在响应【顶层】（carVin/carId/user、total/rows）
        · carInfo / carState / feedbackDetail 的数据在 { data: {...} }
        · feedbackList 的 data 是【数组】
        · 其余（login/register/bind/control/feedbackAdd/feedbackDelete/logDelete）直接 { code, msg }
    - code=200 成功；401 表示鉴权未放行（后端安全拦截）
servers:
  - url: http://121.36.14.143:10001
    description: 真服务器
security:
  - bearerAuth: []
paths:
  /app/login:
    post:
      tags: [认证]
      summary: 登录
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginReq' }
            example: { username: 'admin', password: 'Neuedu@admin' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResult' }
  /system/user/register:
    post:
      tags: [认证]
      summary: 注册
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterReq' }
            example:
              nickName: '杨庆鸿'
              userName: 'zzq1234'
              phonenumber: ''
              sex: '0'
              avatar: ''
              password: '666666'
              roleIds: ['9']
              birthDate: ''
              state: '0'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BasicResult' }
  /getInfo:
    get:
      tags: [用户信息]
      summary: 获取登录用户信息（字段在响应顶层）
      operationId: getInfo
      responses:
        '200':
          description: 成功（carVin/carId/user 在顶层）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GetInfoResult' }
              example:
                code: 200
                msg: '操作成功'
                carVin: '00661718330'
                carId: '1'
                user: { userId: '1', userName: 'zzq1234', nickName: '杨庆鸿', avatar: '', phonenumber: '' }
  /cockpit/info/bindCarVin:
    post:
      tags: [车辆]
      summary: 绑定车辆（按 VIN）
      operationId: bindCarVin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BindReq' }
            example: { carVin: '00661718330' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BasicResult' }
  /cockpit/info/{id}:
    get:
      tags: [车辆]
      summary: 车辆管理信息
      operationId: carInfo
      parameters:
        - { name: id, in: path, required: true, description: '车辆 id（来自 getInfo.carId）', schema: { type: string, example: '1' } }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CarInfoResult' }
  /cockpit/state/{carVin}:
    get:
      tags: [车辆]
      summary: 车辆状态
      operationId: carState
      parameters:
        - { name: carVin, in: path, required: true, description: '车架号（来自 getInfo.carVin）', schema: { type: string, example: '00661718330' } }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CarStateResult' }
  /cockpit/state:
    put:
      tags: [车辆]
      summary: 修改空调/状态
      operationId: changeState
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CarStateChange' }
            example: { carVin: '00661718330', acBtn: '1', setTemp: '26', circulate: '0' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BasicResult' }
  /cockpit/control/door:
    post:
      tags: [车辆控制]
      summary: 车门控制
      operationId: controlDoor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ControlDoorLightReq' }
            example: { carId: '1', door: '1' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BasicResult' }
  /cockpit/control/light:
    post:
      tags: [车辆控制]
      summary: 车灯控制
      operationId: controlLight
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ControlDoorLightReq' }
            example: { carId: '1', light: '1' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BasicResult' }
  /cockpit/control/stop/{carId}:
    post:
      tags: [车辆控制]
      summary: 停车
      operationId: controlStop
      parameters:
        - { name: carId, in: path, required: true, schema: { type: string, example: '1' } }
      responses:
        '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/BasicResult' } } } }
  /cockpit/control/right/{carId}:
    post:
      tags: [车辆控制]
      summary: 右转
      operationId: controlRight
      parameters:
        - { name: carId, in: path, required: true, schema: { type: string, example: '1' } }
      responses:
        '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/BasicResult' } } } }
  /cockpit/control/left/{carId}:
    post:
      tags: [车辆控制]
      summary: 左转
      operationId: controlLeft
      parameters:
        - { name: carId, in: path, required: true, schema: { type: string, example: '1' } }
      responses:
        '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/BasicResult' } } } }
  /cockpit/control/move/{carId}:
    post:
      tags: [车辆控制]
      summary: 前进
      operationId: controlMove
      parameters:
        - { name: carId, in: path, required: true, schema: { type: string, example: '1' } }
      responses:
        '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/BasicResult' } } } }
  /cockpit/control/back/{carId}:
    post:
      tags: [车辆控制]
      summary: 后退
      operationId: controlBack
      parameters:
        - { name: carId, in: path, required: true, schema: { type: string, example: '1' } }
      responses:
        '200': { description: 成功, content: { application/json: { schema: { $ref: '#/components/schemas/BasicResult' } } } }
  /cockpit/feedback/backList:
    get:
      tags: [反馈]
      summary: 反馈列表（data 为数组）
      operationId: feedbackList
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeedbackListResult' }
  /cockpit/feedback/add:
    post:
      tags: [反馈]
      summary: 新增反馈
      operationId: feedbackAdd
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FeedbackAddReq' }
            example: { content: '车机低温启动较慢', status: '0' }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BasicResult' }
  /cockpit/feedback/{id}:
    get:
      tags: [反馈]
      summary: 反馈详情
      operationId: feedbackDetail
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, example: '1' } }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeedbackDetailResult' }
  /cockpit/feedback/{ids}:
    delete:
      tags: [反馈]
      summary: 删除反馈
      operationId: feedbackDelete
      parameters:
        - { name: ids, in: path, required: true, schema: { type: string, example: '1' } }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BasicResult' }
  /cockpit/log/list:
    get:
      tags: [日志]
      summary: 车辆操作日志（total/rows 在顶层）
      operationId: logList
      parameters:
        - { name: pageNum, in: query, schema: { type: integer, example: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, example: 20 } }
        - { name: operaContent, in: query, schema: { type: string, example: '' } }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogListResult' }
  /cockpit/log/{ids}:
    delete:
      tags: [日志]
      summary: 删除日志
      operationId: logDelete
      parameters:
        - { name: ids, in: path, required: true, schema: { type: string, example: '1' } }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BasicResult' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LoginReq:
      type: object
      required: [username, password]
      properties:
        username: { type: string, example: 'admin' }
        password: { type: string, example: 'Neuedu@admin' }
    LoginResult:
      type: object
      properties:
        code: { type: integer, example: 200 }
        msg: { type: string, example: '操作成功' }
        token: { type: string, description: 登录成功下发，后续 Bearer 携带 }
    BasicResult:
      type: object
      properties:
        code: { type: integer, example: 200 }
        msg: { type: string, example: '操作成功' }
    RegisterReq:
      type: object
      required: [userName, password, roleIds]
      properties:
        nickName: { type: string }
        userName: { type: string }
        phonenumber: { type: string }
        sex: { type: string, enum: ['0', '1'] }
        avatar: { type: string }
        password: { type: string }
        roleIds: { type: array, items: { type: string } }
        birthDate: { type: string }
        state: { type: string }
    BindReq:
      type: object
      required: [carVin]
      properties:
        carVin: { type: string, example: '00661718330' }
    GetInfoResult:
      type: object
      properties:
        code: { type: integer, example: 200 }
        msg: { type: string, example: '操作成功' }
        permissions: { type: array, items: { type: string } }
        roles: { type: array, items: { type: string } }
        sign: { type: string }
        carVin: { type: string, example: '00661718330' }
        carId: { type: string, example: '1' }
        user: { $ref: '#/components/schemas/User' }
    User:
      type: object
      properties:
        userId: { type: string, example: '1' }
        deptId: { type: string }
        userName: { type: string, example: 'zzq1234' }
        nickName: { type: string, example: '杨庆鸿' }
        avatar: { type: string }
        phonenumber: { type: string }
    CarInfoResult:
      type: object
      properties:
        code: { type: integer, example: 200 }
        msg: { type: string, example: '操作成功' }
        data: { $ref: '#/components/schemas/CarInfo' }
    CarInfo:
      type: object
      properties:
        id: { type: string, example: '1' }
        carName: { type: string, example: '哈弗6' }
        brand: { type: string, example: '哈弗' }
        carVin: { type: string, example: '00661718330' }
        batteryPower: { type: string, description: 电池电量（字符串，如 "999"）, example: '999' }
        enduranceMileage: { type: string, example: '1500' }
        horsePower: { type: string }
        maxPower: { type: string }
        maxTorque: { type: string }
        carSize: { type: string }
        wheelBase: { type: string }
        batteryCapacity: { type: string }
        nominalVoltage: { type: string }
        totalTripNum: { type: number, example: 200 }
        totalTripMile: { type: string, example: '5000' }
        createYm: { type: string, example: '2024-05' }
    CarStateResult:
      type: object
      properties:
        code: { type: integer, example: 200 }
        msg: { type: string, example: '操作成功' }
        data: { $ref: '#/components/schemas/CarStat' }
    CarStat:
      type: object
      properties:
        carId: { type: string, example: '1' }
        carVin: { type: string, example: '00661718330' }
        door: { type: string, enum: ['0', '1'] }
        light: { type: string, enum: ['0', '1'] }
        temperature: { type: string, example: '26' }
        windLevel: { type: string, example: '2' }
        circulate: { type: string, enum: ['0', '1'] }
        setTemp: { type: string, example: '26' }
        acBtn: { type: string, enum: ['0', '1'] }
        clearFog: { type: string, enum: ['0', '1'] }
        fanState: { type: string, enum: ['0', '1'] }
        playMode: { type: string }
        processMp3: { type: string }
        mp3Playing: { type: string }
        processMp4: { type: string }
        mp4Playing: { type: string }
    CarStateChange:
      type: object
      properties:
        carVin: { type: string, example: '00661718330' }
        auto: { type: string, enum: ['0', '1'], description: '空调开关（文档亦见 acBtn）' }
        door: { type: string, enum: ['0', '1'] }
        light: { type: string, enum: ['0', '1'] }
        temperature: { type: string, example: '26' }
        windLevel: { type: string, example: '2' }
        circulate: { type: string, enum: ['0', '1'] }
        setTemp: { type: string, example: '26' }
        acBtn: { type: string, enum: ['0', '1'] }
        clearFog: { type: string, enum: ['0', '1'] }
        fanState: { type: string, enum: ['0', '1'] }
        playMode: { type: string }
        processMp3: { type: string }
        mp3Playing: { type: string }
        processMp4: { type: string }
        mp4Playing: { type: string }
    ControlDoorLightReq:
      type: object
      required: [carId]
      properties:
        carId: { type: string, example: '1' }
        door: { type: string, enum: ['0', '1'] }
        light: { type: string, enum: ['0', '1'] }
    FeedbackListResult:
      type: object
      properties:
        code: { type: integer, example: 200 }
        msg: { type: string, example: '操作成功' }
        data:
          type: array
          items: { $ref: '#/components/schemas/Feedback' }
    FeedbackDetailResult:
      type: object
      properties:
        code: { type: integer, example: 200 }
        msg: { type: string, example: '操作成功' }
        data: { $ref: '#/components/schemas/Feedback' }
    Feedback:
      type: object
      properties:
        id: { type: string, example: '1' }
        userId: { type: string }
        userName: { type: string }
        nickName: { type: string }
        phonenumber: { type: string }
        content: { type: string, example: '车机低温启动较慢' }
        status: { type: string, enum: ['0', '1'], description: '0未读 1已读' }
        picUrl: { type: string }
        delFlag: { type: string }
        replyRead: { type: string }
        createTime: { type: string, example: '2024-05-01 10:00' }
        updateTime: { type: string }
        reply: { type: string, example: '感谢反馈' }
    FeedbackAddReq:
      type: object
      required: [content]
      properties:
        content: { type: string, example: '车机低温启动较慢' }
        status: { type: string, enum: ['0', '1'] }
    LogListResult:
      type: object
      properties:
        code: { type: integer, example: 200 }
        msg: { type: string, example: '查询成功' }
        total: { type: number, example: 5 }
        rows:
          type: array
          items: { $ref: '#/components/schemas/OperationLog' }
    OperationLog:
      type: object
      properties:
        id: { type: string, example: '6' }
        userId: { type: string }
        userName: { type: string, example: '东软信息学院' }
        carId: { type: string, example: '1' }
        carName: { type: string, example: '哈弗6' }
        operaType: { type: string, example: '车辆移动' }
        operaContent: { type: string, example: '用户admin控制车辆哈弗6进行了车辆移动操作' }
        createTime: { type: string, example: '2024-05-07 15:08:16' }
